{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
  </head>
  <body class="login-page">
    {% include "navbar.html" %}
    <main class="login-shell">
      <section class="login-card">
        <div class="login-visual">
          <div class="visual-orb orb-1"></div>
          <div class="visual-orb orb-2"></div>
          <div class="visual-orb orb-3"></div>
          <div class="visual-content">
            <p class="eyebrow">Acceso seguro</p>
            <h1>Bienvenido</h1>
            <p class="visual-copy">Ingresa con tu correo y contraseña para continuar.</p>
            <div class="visual-chip">Supli</div>
          </div>
        </div>
        <div class="login-form">
          <div class="form-head">
            <h2>Login</h2>
            <p>Tu portal privado, listo en segundos.</p>
          </div>
          {% if error %}
            <div class="alert">{{ error }}</div>
          {% endif %}
          <form method="post" autocomplete="on">
            {% csrf_token %}
            <div class="field">
              <label for="email">Correo</label>
              <input type="email" id="email" name="email" autocomplete="email" placeholder="tucorreo@dominio.com" required>
            </div>
            <div class="field">
              <label for="password">Contrasena</label>
              <div class="input-eye-wrap">
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
                <button type="button" class="eye-btn" id="togglePassword" aria-label="Mostrar contraseña">
                  <svg class="eye-icon" id="eyeShow" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg class="eye-icon hidden" id="eyeHide" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>
                  </svg>
                </button>
              </div>
            </div>
            <button class="btn-primary" type="submit">Entrar</button>
            <div class="helper-links">
              <a class="text-link" href="{% url 'recuperar_password' %}">Recuperar contrasena</a>
            </div>
          </form>
        </div>
      </section>
    </main>
    <script src="{% static 'js/login.js' %}"></script>
  </body>
</html>
